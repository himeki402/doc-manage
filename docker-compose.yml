name: doc-manage

services:
  postgres:
    # Match the legacy PostgreSQL 17 dump format used during the migration.
    image: postgres:17-alpine
    restart: unless-stopped
    # Preserve compatibility with the existing API environment during the
    # migration. A root .env, when present, overrides these legacy values.
    env_file:
      - path: ./apps/api/.env
        required: false
      - path: ./.env
        required: false
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ocr:
    build:
      context: ./microservice
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-8000}:8000"
    volumes:
      - ./microservice:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/api/.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PDF_EXTRACT_SERVICE_URL: http://ocr:8000/extract-text
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/node_modules
      - api_uploads:/workspace/apps/api/uploads

  migrate:
    image: doc-manage-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ./apps/api/.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: npm --workspace=api run migration:run
    restart: "no"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/web/.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
      NEXT_PUBLIC_OCR_API_URL: http://localhost:${OCR_PORT:-8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/node_modules

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  api_uploads:
